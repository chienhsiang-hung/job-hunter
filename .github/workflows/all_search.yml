name: run all_search.py

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 23 * * *'
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4 # checkout the repository content
        
      - name: setup python
        uses: actions/setup-python@v3
      - name: install python packages
        run: pip install -r requirements.txt

      - name: execute py script # run all_search.py
        run: python all_search.py
      - name: Upload search result # check out https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/storing-and-sharing-data-from-a-workflow
        uses: actions/upload-artifact@v4
        with:
          name: search result
          path: |
            tmp/Result.xlsx
            tmp/Result.json
            tmp/meta.txt
      
      - name: Read Result.json
        id: resultJson
        uses: juliangruber/read-file-action@v1
        with:
          path: ./tmp/Result.json

      - name: Read meta.txt
        id: readMeta
        uses: juliangruber/read-file-action@v1
        with:
          path: ./tmp/meta.txt

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: ${{ steps.readMeta.outputs.content }} ${{ steps.resultJson.outputs.content }}
